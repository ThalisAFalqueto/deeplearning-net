# Parte 2 (Trilha C) no DSB2018 — o resultado que vai para a apresentação.
# Comparar contra a Parte 1: IoU 0,8098 / mAP 0,4439 com o baseline binário.
# Em GPU, aumentar epochs (60+), batch_size (32) e num_workers (4).
name: p2_dsb2018
seed: 0

data:
  kind: dsb2018
  size: 256
  # onde estão as amostras (busca recursiva; subpastas não influenciam a divisão)
  data_dir: src/data/datasets/dsb2018
  # fração para validação. A divisão é sempre estratificada por modalidade
  # (fluorescência / histologia / brightfield), recalculada a cada execução.
  val_fraction: 0.15

model:
  name: unet_improved
  base: 16
  depth: 3
  loss:
    w_seg: 1.0
    w_heatmap: 1.0
    w_offset: 0.1          # a L1 dos offsets é medida em pixels: sem escalar, domina
    pos_weight: 50.0       # compensa o pico ser ~0,06% da imagem; 0 = L2 pura (Eixo 2)

train:
  epochs: 100
  batch_size: 8
  lr: 0.006
  num_workers: 0
  save_every: 5           # grava last.pth a cada N épocas, para poder retomar

decode:
  threshold: 0.5           # foreground
  # Varrido no sintético: 0,3 -> mAP 0,424 / erro 1,93 | 0,5 -> 0,476 / 1,75
  # | 0,7 -> 0,497 / 2,80. Limiar alto exige picos mais confiantes: sobe o mAP mas
  # perde objetos fracos, e a contagem piora. 0,5 é o melhor equilíbrio entre as duas
  # métricas que o enunciado pede.
  peak_threshold: 0.5
  nms_kernel: 3

output_dir: outputs/p2
