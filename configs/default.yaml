# Parte 1 — dados reais (DSB2018).
# Uso: python -m main --config configs/default.yaml
#      python -m main --synthetic  (atalho para configs/synthetic.yaml)
name: p1_dsb2018
seed: 0

data:
  kind: dsb2018
  size: 256
  train_dir: src/data/datasets/dsb2018/train
  val_dir: src/data/datasets/dsb2018/validation

model:
  base: 16
  depth: 3
  out_channels: 1

train:
  epochs: 20
  batch_size: 8
  lr: 0.001
  num_workers: 0

decode:
  threshold: 0.5

output_dir: outputs/p1
