# Parte 1 — baseline binário no DSB2018.
# Usado como referência na ablação contra a Parte 2 (Trilha C).
name: baseline
seed: 0

data:
  kind: dsb2018
  size: 256
  data_dir: src/data/datasets/dsb2018
  val_fraction: 0.15

model:
  name: unet_improved
  base: 16
  depth: 3
  out_channels: 1

train:
  epochs: 200
  batch_size: 8
  lr: 0.005
  num_workers: 0
  save_every: 5

decode:
  threshold: 0.5

output_dir: outputs/p1
