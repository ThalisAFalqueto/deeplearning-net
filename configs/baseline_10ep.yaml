# Baseline da ablação do Eixo 3 no regime curto: igual ao configs/default.yaml, só com
# epochs: 10 — o mesmo regime do configs/unet_ppm_dsb2018.yaml. O runner de ablação usa as
# épocas de cada config, então comparar unet_ppm (10 ép.) com default.yaml (50 ép.) mediria
# o treino mais longo, não o pyramid pooling.
#
# Uso: uv run main.py --ablation configs/baseline_10ep.yaml configs/unet_ppm_dsb2018.yaml --ablation-seeds 0 42
name: baseline_10ep
seed: 0

data:
  kind: dsb2018
  size: 256
  data_dir: src/data/datasets/dsb2018
  val_fraction: 0.15

model:
  name: unet_improved
  base: 16
  depth: 3
  loss:
    name: center_offset
    w_seg: 1.0
    w_heatmap: 1.0
    w_offset: 0.1
    pos_weight: 50.0

train:
  epochs: 10
  batch_size: 8
  lr: 0.005
  num_workers: 0
  save_every: 5

decode:
  threshold: 0.5
  peak_threshold: 0.5
  nms_kernel: 3

output_dir: outputs/baseline_10ep
