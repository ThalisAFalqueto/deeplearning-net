# Baseline do Eixo 3 (Parte 3): igual ao configs/default.yaml, só com epochs: 20 — o mesmo
# orçamento do configs/unet_ppm_dsb2018.yaml. O runner de ablação usa as épocas de cada config,
# então comparar unet_ppm (20) com default.yaml (50) mediria o treino mais longo, não o
# pyramid pooling.
#
# Uso: uv run main.py --ablation configs/baseline_20ep.yaml configs/unet_ppm_dsb2018.yaml --ablation-seeds 0 42
name: baseline_20ep
seed: 0

data:
  kind: dsb2018
  size: 256
  data_dir: src/data/datasets/dsb2018
  val_fraction: 0.15

model:
  name: unet_improved
  base: 16
  depth: 3
  loss:
    name: center_offset
    w_seg: 1.0
    w_heatmap: 1.0
    w_offset: 0.1          # a L1 dos offsets é medida em pixels: sem escalar, domina
    pos_weight: 50.0       # compensa o pico ser ~0,06% da imagem; 0 = L2 pura (Eixo 2)

train:
  epochs: 20
  batch_size: 8
  lr: 0.005
  num_workers: 0
  save_every: 5

decode:
  threshold: 0.5           # foreground
  peak_threshold: 0.5
  nms_kernel: 3

# outputs/p1 guarda o resultado da Parte 1 (binário, 05/09) — não gravar em cima dele.
# Na ablação, o runner troca esta pasta pela da run.
output_dir: outputs/baseline_20ep
