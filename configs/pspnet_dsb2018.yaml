# PSPNet no DSB2018 — Pyramid Pooling Module + Trilha C (seg + heatmap + offsets).
# Uso: python -m main --config configs/pspnet_dsb2018.yaml
name: pspnet_dsb2018
seed: 0

data:
  kind: dsb2018
  size: 256
  data_dir: src/data/datasets/dsb2018
  val_fraction: 0.15

model:
  name: pspnet
  base: 16
  depth: 3
  loss:
    name: center_offset
    w_seg: 1.0
    w_heatmap: 1.0
    w_offset: 0.1
    pos_weight: 50.0

train:
  epochs: 20
  batch_size: 8
  lr: 0.005
  num_workers: 0
  save_every: 5

decode:
  threshold: 0.5
  peak_threshold: 0.5
  nms_kernel: 3

output_dir: outputs/pspnet
