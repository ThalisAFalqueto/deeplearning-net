# Config exemplo para ResUNet no DSB2018.
# Uso: python -m main --config configs/resunet_dsb2018.yaml
name: resunet_dsb2018
seed: 0

data:
  kind: dsb2018
  size: 256
  data_dir: src/data/datasets/dsb2018
  val_fraction: 0.15

model:
  name: resunet
  base: 16
  depth: 3
  out_channels: 1

train:
  epochs: 10
  batch_size: 8
  lr: 0.001
  num_workers: 0
  save_every: 5

decode:
  threshold: 0.5

output_dir: outputs/resunet
