# Parte 2 (Trilha C) no dataset sintético — validação rápida em CPU antes de ir para a GPU.
# Comparar contra a Parte 0: mAP 0,2253 com o baseline binário.
name: p2_synthetic
seed: 0

data:
  kind: synthetic
  size: 128
  n_train: 240
  n_val: 60
  min_obj: 5
  max_obj: 20

model:
  base: 16
  depth: 3
  task: center_offset
  out_channels: 4          # 1 foreground + 1 heatmap + 2 offsets
  loss:
    w_seg: 1.0
    w_heatmap: 1.0
    w_offset: 0.1          # a L1 dos offsets é medida em pixels: sem escalar, domina
    pos_weight: 50.0       # compensa o pico ser ~0,06% da imagem; 0 = L2 pura (Eixo 2)

train:
  epochs: 20
  batch_size: 8
  lr: 0.001
  num_workers: 0
  save_every: 5           # grava last.pth a cada N épocas, para poder retomar

decode:
  threshold: 0.5           # foreground
  # Varrido no sintético: 0,3 -> mAP 0,424 / erro 1,93 | 0,5 -> 0,476 / 1,75
  # | 0,7 -> 0,497 / 2,80. Limiar alto exige picos mais confiantes: sobe o mAP mas
  # perde objetos fracos, e a contagem piora. 0,5 é o melhor equilíbrio entre as duas
  # métricas que o enunciado pede.
  peak_threshold: 0.5
  nms_kernel: 3

output_dir: outputs/p2_synthetic
